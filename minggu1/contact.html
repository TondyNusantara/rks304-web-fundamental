<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tondy Nusantara Siregar - Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="nav">
      <a href="index.html" class="logo">Tondy</a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="portfolio.html">Portfolio</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section>
      <h2>Hubungi Saya</h2>
      <p>Ada pertanyaan atau ingin berkolaborasi? Kirim pesan lewat form di bawah.</p>

      <form action="contact.html" method="post">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" required>

        <label for="email">Alamat Email</label>
        <input type="email" id="email" name="email" required>

        <label for="kategori">Kategori / Keperluan</label>
        <select id="kategori" name="kategori" required>
          <option value="">Pilih kategori</option>
          <option value="konsultasi">Konsultasi</option>
          <option value="kolaborasi">Kolaborasi Proyek</option>
          <option value="umum">Pertanyaan Umum</option>
        </select>

        <label for="pesan">Pesan</label>
        <textarea id="pesan" name="pesan" rows="5" required></textarea>

        <button type="submit">Kirim Pesan</button>
      </form>
    </section>
  </main>

  <footer>
    <div class="container">&copy; 2026 Tondy Nusantara Siregar</div>
  </footer>
</body>
</html>
